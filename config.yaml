llm:
  backend: auto
  model: null
  temperature: '0.5'
  max_tokens: 2048
  ollama_base_url: http://localhost:11434
  openai_base_url: http://localhost:1234/v1
  openai_api_key: not-needed
  nvidia_api_key: null
  nvidia_base_url: https://integrate.api.nvidia.com/v1
  nvidia_model: meta/llama-3.1-8b-instruct
agent:
  default_agent: assistant
  max_steps: 20
  system_prompt: null
  enabled_tools:
  - file
  - web
  - code
web:
  host: 127.0.0.1
  port: 8080
  enable_cors: true
  ws_heartbeat: 30
desktop:
  width: 1200
  height: 800
  title: Local AI Agents
  debug: false
terminal:
  theme: dark
  show_timestamps: true
  max_history: 1000
  syntax_highlighting: true
memory:
  enabled: true
  db_path: memory.db
  vector_store_path: vector_store
  max_short_term: 50
  max_long_term: 1000
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
skills:
  enabled: true
  skills_dir: skills
  auto_load: true
data_dir: data
logs_dir: logs
